<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomstash Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      padding: 20px;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #444;
    }

    .field input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }

    .field input:focus {
      outline: none;
      border-color: #666;
    }

    .field textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
    }

    .field textarea:focus {
      outline: none;
      border-color: #666;
    }

    .field select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }

    .steps {
      list-style: none;
      margin: 0 0 14px;
      font-size: 12px;
      color: #555;
    }

    .steps li {
      margin-bottom: 3px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button.secondary {
      background: #f5f5f5;
      color: #1a1a1a;
      border: 1px solid #ccc;
    }

    button.secondary:hover {
      background: #eee;
    }

    #status.error {
      color: #b00020;
    }

    .field .help {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }

    button {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #1e7e34;
    }
  </style>
</head>
<body>
  <h1>Tomstash Settings</h1>

  <form id="settings-form">
    <div class="field">
      <label for="backend">Where should links be saved?</label>
      <select id="backend"></select>
    </div>

    <ul id="steps" class="steps"></ul>

    <div id="backend-fields"></div>

    <div class="field">
      <label for="custom-prompt">Custom description prompt</label>
      <textarea id="custom-prompt" rows="7"></textarea>
      <p class="help">Used by the "Custom" button in the popup. The article title and text are sent after it. Clear the box and save to restore the default.</p>
    </div>

    <div class="buttons">
      <button type="submit">Save Settings</button>
      <button type="button" id="test-btn" class="secondary">Test connection</button>
    </div>
    <div id="status"></div>
  </form>

  <script type="module" src="options.js"></script>
</body>
</html>
