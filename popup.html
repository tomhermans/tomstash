<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save Link</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Save Link</h1>
    </header>

    <div id="status" hidden></div>

    <form id="save-form">
      <div class="field">
        <label for="url">URL</label>
        <input type="url" id="url" name="url" readonly />
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="2"></textarea>
        <div class="btn-row" id="generate-row">
          <button type="button" class="mini-btn" data-kind="tldr" hidden disabled>TL;DR</button>
          <button type="button" class="mini-btn" data-kind="teaser" hidden disabled>Teaser</button>
          <button type="button" class="mini-btn" data-kind="custom" hidden disabled>Custom</button>
        </div>
      </div>

      <div class="field">
        <label for="tags">Tags <span class="hint">(comma-separated)</span></label>
        <input type="text" id="tags" name="tags" placeholder="e.g. css, tools, astro" />
        <button type="button" id="suggest-tags" class="mini-btn" hidden disabled>Suggest tags</button>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="">None</option>
          <option value="articles">Articles</option>
          <option value="tools">Tools</option>
          <option value="videos">Videos</option>
          <option value="tutorials">Tutorials</option>
          <option value="reference">Reference</option>
          <option value="inspiration">Inspiration</option>
          <option value="news">News</option>
        </select>
      </div>

      <label><input type="checkbox" id="save-content" checked> Save page content</label>
      <div id="content-status" class="hint"></div>

      <div class="actions">
        <button type="submit" id="save-btn">Save</button>
      </div>
    </form>

    <div id="not-configured" hidden>
      <p>Please configure your API settings first.</p>
      <button id="open-options">Open Settings</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
